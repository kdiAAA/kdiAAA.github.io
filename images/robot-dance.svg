<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dancing robot that juggles mid-dance: sways, kicks and bounces while keeping 3 balls in the air -->
  <style>
    * { transform-box: view-box; }
    /* Bounce with a little squash and stretch, two bounces per sway */
    .bounce  { transform-origin: 32px 58px; animation: bounce 0.6s cubic-bezier(.45,0,.55,1) infinite; }
    /* Dance sway from the hips; balls ride along so the hands still catch them */
    .sway    { transform-origin: 32px 47px; animation: sway 1.2s ease-in-out infinite; }
    .antenna { transform-origin: 32px 22px; animation: antenna 0.6s ease-in-out infinite; }
    .armL    { transform-origin: 24px 38px; animation: armL 0.6s ease-in-out infinite; }
    .armR    { transform-origin: 40px 38px; animation: armR 0.6s ease-in-out infinite; }
    .legL    { transform-origin: 28px 47px; animation: legL 1.2s ease-in-out infinite; }
    .legR    { transform-origin: 36px 47px; animation: legR 1.2s ease-in-out infinite; }
    .blink   { animation: blink 1.2s steps(1) infinite; }
    @keyframes bounce  { 0%,100% { transform: scale(1.06, 0.9); } 50% { transform: translateY(-2px) scale(0.95, 1.08); } }
    @keyframes sway    { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
    @keyframes antenna { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
    @keyframes armL    { 0%,100% { transform: rotate(-22deg) scale(1.2); } 50% { transform: rotate(14deg) scale(0.95); } }
    @keyframes armR    { 0%,100% { transform: rotate(-14deg) scale(0.95); } 50% { transform: rotate(22deg) scale(1.2); } }
    /* Alternate kicks: left leg on the way out, right leg on the way back */
    @keyframes legL    { 0%,50%,100% { transform: rotate(0deg); } 25% { transform: rotate(30deg); } }
    @keyframes legR    { 0%,50%,100% { transform: rotate(0deg); } 75% { transform: rotate(-30deg); } }
    @keyframes blink   { 0% { fill: #ff7a59; } 50% { fill: #ffd646; } }
    @media (prefers-reduced-motion: reduce) {
      .bounce, .sway, .antenna, .armL, .armR, .legL, .legR, .blink { animation: none; }
      .ball { display: none; }
    }
  </style>

  <!-- 3-ball cascade: throw from the inside, catch on the outside, carry back in -->
  <path id="cascade" fill="none" d="M21 41 C 23 -4, 41 -4, 47 41 C 47 45, 43 45, 43 41 C 41 -4, 23 -4, 17 41 C 17 45, 21 45, 21 41 Z"/>

  <g class="bounce" stroke="#1f3f66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="legL" d="M28 47 L25 57 L21 58" fill="none"/>
    <path class="legR" d="M36 47 L39 57 L43 58" fill="none"/>
    <g class="sway">
      <rect x="24" y="35" width="16" height="12" rx="3" fill="#2f7fc1"/>
      <circle cx="32" cy="41" r="2.2" fill="#ffd646" stroke="none"/>
      <g class="head">
        <g class="antenna">
          <line x1="32" y1="17" x2="32" y2="22" fill="none"/>
          <circle class="blink" cx="32" cy="16" r="2.2" fill="#ff7a59"/>
        </g>
        <rect x="23" y="22" width="18" height="12" rx="4" fill="#5aa3dc"/>
        <circle cx="28" cy="27.5" r="1.8" fill="#1f3f66" stroke="none"/>
        <circle cx="36" cy="27.5" r="1.8" fill="#1f3f66" stroke="none"/>
        <path d="M29.5 31 Q32 33 34.5 31" fill="none" stroke-width="1.6"/>
      </g>
      <path class="armL" d="M24 38 L19 45 L17 41" fill="none"/>
      <path class="armR" d="M40 38 L45 45 L47 41" fill="none"/>
      <g stroke-width="1.5">
        <circle class="ball" r="3" fill="#ffd646">
          <animateMotion dur="1.8s" begin="0s" repeatCount="indefinite"><mpath href="#cascade"/></animateMotion>
        </circle>
        <circle class="ball" r="3" fill="#ff7a59">
          <animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite"><mpath href="#cascade"/></animateMotion>
        </circle>
        <circle class="ball" r="3" fill="#8fd0f5">
          <animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite"><mpath href="#cascade"/></animateMotion>
        </circle>
      </g>
    </g>
  </g>
</svg>
