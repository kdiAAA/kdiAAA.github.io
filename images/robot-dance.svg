<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Animated dancing robot shown next to the name (same art as favicon.svg) -->
  <style>
    * { transform-box: view-box; }
    .bob   { animation: bob 0.8s ease-in-out infinite; }
    .sway  { transform-origin: 32px 42px; animation: sway 1.6s ease-in-out infinite; }
    .armL  { transform-origin: 24px 31px; animation: armL 0.8s ease-in-out infinite; }
    .armR  { transform-origin: 40px 31px; animation: armR 0.8s ease-in-out infinite; }
    .legL  { transform-origin: 28px 42px; animation: legL 1.6s ease-in-out infinite; }
    .legR  { transform-origin: 36px 42px; animation: legR 1.6s ease-in-out infinite; }
    .blink { transform-origin: 32px 7px; animation: blink 0.8s steps(1) infinite; }
    @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes sway { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes armL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-35deg); } }
    @keyframes armR { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-40deg); } }
    @keyframes legL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(18deg); } }
    @keyframes legR { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-22deg); } }
    @keyframes blink { 0% { fill: #ff7a59; } 50% { fill: #ffd646; } }
    @media (prefers-reduced-motion: reduce) {
      .bob, .sway, .armL, .armR, .legL, .legR, .blink { animation: none; }
    }
  </style>
  <g class="bob" stroke="#1f3f66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <g class="sway">
      <line x1="32" y1="9" x2="32" y2="14" fill="none"/>
      <circle class="blink" cx="32" cy="8" r="2.2" fill="#ff7a59"/>
      <rect x="23" y="14" width="18" height="13" rx="4" fill="#5aa3dc"/>
      <circle cx="28" cy="20.5" r="1.8" fill="#1f3f66" stroke="none"/>
      <circle cx="36" cy="20.5" r="1.8" fill="#1f3f66" stroke="none"/>
      <path d="M28.5 24 Q32 26 35.5 24" fill="none" stroke-width="1.6"/>
      <path class="armL" d="M24 31 L16 26 L13 18" fill="none"/>
      <path class="armR" d="M40 31 L47 36 L52 33" fill="none"/>
      <rect x="24" y="28" width="16" height="14" rx="3" fill="#2f7fc1"/>
      <circle cx="32" cy="35" r="2.2" fill="#ffd646" stroke="none"/>
    </g>
    <path class="legL" d="M28 42 L26 50 L21 52" fill="none"/>
    <path class="legR" d="M36 42 L42 47 L45 54" fill="none"/>
  </g>
</svg>
