<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dancing robot: site palette (sky blue + sunny yellow) -->
  <circle cx="32" cy="32" r="31" fill="#ffd646"/>
  <g stroke="#1f3f66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 32 40;8 32 40;-8 32 40" dur="1s" repeatCount="indefinite"/>
      <!-- antenna -->
      <line x1="32" y1="9" x2="32" y2="14" fill="none"/>
      <circle cx="32" cy="8" r="2.2" fill="#ff7a59"/>
      <!-- head -->
      <rect x="23" y="14" width="18" height="13" rx="4" fill="#5aa3dc"/>
      <circle cx="28" cy="20.5" r="1.8" fill="#1f3f66" stroke="none"/>
      <circle cx="36" cy="20.5" r="1.8" fill="#1f3f66" stroke="none"/>
      <path d="M28.5 24 Q32 26 35.5 24" fill="none" stroke-width="1.6"/>
      <!-- arms: one up, one down -->
      <path d="M24 31 L16 26 L13 18" fill="none"/>
      <path d="M40 31 L47 36 L52 33" fill="none"/>
      <!-- body -->
      <rect x="24" y="28" width="16" height="14" rx="3" fill="#2f7fc1"/>
      <circle cx="32" cy="35" r="2.2" fill="#ffd646" stroke="none"/>
    </g>
    <!-- legs: one planted, one kicking -->
    <path d="M28 42 L26 50 L21 52" fill="none"/>
    <path d="M36 42 L42 47 L45 54" fill="none"/>
  </g>
</svg>
